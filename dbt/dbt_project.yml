name: finances92
version: "0.1.0"
config-version: 2

profile: finances92

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  annee_min: 2015
  annee_max: 2025
  # Duo mis en avant par défaut sur le site
  ville_a: "92075"   # Vanves
  ville_b: "92046"   # Malakoff

models:
  finances92:
    staging:
      # Tables et non vues : les sources sont des parquet lus par chemin relatif.
      # On ne veut pas que ce chemin soit résolu à chaque requête aval (le site
      # Evidence n'a pas le même répertoire courant que dbt).
      +materialized: table
      +schema: staging
    intermediate:
      +materialized: table
    marts:
      # Matérialisation externe : chaque mart est écrit en parquet dans data/marts/,
      # c'est ce que lit le site Evidence.
      # (le répertoire de sortie est `external_root` dans profiles.yml)
      +materialized: external
      +format: parquet
