version: 2

models:
  - name: dim_commune
    description: Les 36 communes des Hauts-de-Seine avec leur EPT de rattachement.
    columns:
      - name: code_insee
        description: Code INSEE de la commune (5 caractères).
        tests: [unique, not_null]
      - name: nom_commune
        tests: [not_null]
      - name: siren_ept
        description: SIREN de l'établissement public territorial (sous-ensemble de la MGP).
        tests:
          - not_null
          - accepted_values:
              values: ["200057966", "200057974", "200057982", "200057990"]
      - name: numero_ept
        tests:
          - not_null
          - accepted_values: { values: ["T2", "T3", "T4", "T5"] }
